x-app-environment: &app-environment
  NODE_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: 3000
  DATABASE_URL: postgresql://helpdesk_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/helpdesk
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY}
  CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.50.10}
  STORAGE_DIR: /app/storage
  ATTACHMENT_RETENTION_HOURS: ${ATTACHMENT_RETENTION_HOURS:-24}
  CLEANUP_CHECK_INTERVAL_MS: ${CLEANUP_CHECK_INTERVAL_MS:-3600000}
  IMAP_POLL_INTERVAL_MS: ${IMAP_POLL_INTERVAL_MS:-30000}
  MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
  MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-26214400}
  LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: helpdesk
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/init-db.sh:/docker-entrypoint-initdb.d/10-helpdesk.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d helpdesk]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *app-environment
      MIGRATION_DATABASE_URL: postgresql://helpdesk_owner:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}@postgres:5432/helpdesk
    command: [node, dist/backend/src/db/migrate.js]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["attachments:/app/storage"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 100s
  proxy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      HELPDESK_DOMAIN: ${HELPDESK_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
    mem_limit: 256m
    networks:
      default:
        ipv4_address: ${HELPDESK_PROXY_IP:-172.30.50.10}
networks:
  default:
    ipam:
      config:
        - subnet: ${HELPDESK_SUBNET:-172.30.50.0/24}
volumes:
  pgdata:
  attachments:
  caddy_data:
  caddy_config:
